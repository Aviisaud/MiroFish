
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "backend"]
    restart: unless-stopped

    environment:
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen-plus}
      ZEP_API_KEY: ${ZEP_API_KEY:?Set ZEP_API_KEY}

    expose:
      - "5001"

    volumes:
      - mirofish_uploads:/app/backend/uploads

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "3000:80"

volumes:
  mirofish_uploads:
